services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: backend/.env
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buyerflow
      POSTGRES_USER: buyerflow
      POSTGRES_PASSWORD: change-me
    volumes: [buyerflow_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  buyerflow_pg:

